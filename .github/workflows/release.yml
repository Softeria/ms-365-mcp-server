name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      registry_version:
        description: 'Publish an already released version to the MCP Registry (skips the release itself)'
        required: false
      docker_version:
        description: 'Publish an already released version to ghcr.io (skips the release itself)'
        required: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing
    outputs:
      version: ${{ steps.released.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm i -D patch-package
      - run: npm ci
      - run: npm run generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release writes the released version into package.json, and
      # leaves it untouched when there was nothing to release.
      - name: Read released version
        id: released
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.0.0-development" ]; then
            echo "No release this run, skipping MCP Registry publish"
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Separate job so the publisher binary never runs alongside the build, and so a
  # failed registry publish can be redriven with workflow_dispatch without waiting
  # for the next release.
  publish-registry:
    needs: release
    if: ${{ !cancelled() && (inputs.registry_version != '' || needs.release.outputs.version != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry authentication
    env:
      PUBLISHER_VERSION: v1.8.1
      VERSION: ${{ inputs.registry_version || needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version in server.json
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a version: '$VERSION'" && exit 1 ;;
          esac
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      # The registry validates mcpName against the npm tarball, and npm can take
      # minutes to serve a version it just accepted. 0.154.3 took over three, which
      # outlasted the retries below and failed the release.
      - name: Wait for npm
        run: |
          for i in $(seq 1 40); do
            npm view "@softeria/ms-365-mcp-server@$VERSION" version >/dev/null 2>&1 && exit 0
            sleep 15
          done
          echo "npm never served $VERSION" && exit 1

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # Retries left as a backstop for registry-side flakiness.
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            [ "$i" = 5 ] && break
            echo "Publish attempt $i failed, retrying in $((15 * i))s"
            sleep $((15 * i))
          done
          # A publish can land server-side while the CLI still reports failure, and
          # every retry after that is rejected as a duplicate version. Confirm
          # against the registry before failing the job. Note that the API's name
          # filter is not exact, so the name has to be re-checked here.
          NAME=$(jq -r .name server.json)
          # The search index can lag a publish that just landed, so ask twice.
          for i in 1 2; do
            COUNT=$(curl -sS --get "https://registry.modelcontextprotocol.io/v0/servers" \
              --data-urlencode "search=$NAME" --data-urlencode "version=$VERSION" |
              jq --arg n "$NAME" --arg v "$VERSION" \
                '[.servers[].server | select(.name == $n and .version == $v)] | length' || echo 0)
            if [ "$COUNT" = 1 ]; then
              echo "$NAME@$VERSION is live in the registry, publish succeeded"
              exit 0
            fi
            [ "$i" = 2 ] && break
            sleep 15
          done
          exit 1

  # Separate job for the same reason as publish-registry: a failed push can be redriven
  # with workflow_dispatch instead of waiting for the next release.
  publish-docker:
    needs: release
    if: ${{ !cancelled() && (inputs.docker_version != '' || needs.release.outputs.version != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io
    env:
      # Lowercase on purpose: ghcr rejects the "Softeria" casing github.repository carries.
      IMAGE: ghcr.io/softeria/ms-365-mcp-server
      VERSION: ${{ inputs.docker_version || needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Anchored, because a loose pattern lets a dispatched value carry extra docker
      # arguments into the build below.
      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Not a version: '$VERSION'" && exit 1
          fi

      # Same npm propagation window the registry publish waits out, and a multi-arch
      # build is far too expensive to spend on a version npm will 404 on.
      - name: Wait for npm
        run: |
          for i in $(seq 1 40); do
            npm view "@softeria/ms-365-mcp-server@$VERSION" version >/dev/null 2>&1 && exit 0
            sleep 15
          done
          echo "npm never served $VERSION" && exit 1

      # Only the version tag here. :latest is promoted further down, once this image has
      # been proven to start.
      - name: Build and push image
        run: |
          # Retries left as a backstop for buildx and registry flakiness.
          for i in 1 2 3 4 5; do
            docker buildx build \
              --file Dockerfile.ghcr \
              --platform linux/amd64,linux/arm64 \
              --build-arg "VERSION=$VERSION" \
              --provenance=mode=max \
              --sbom=true \
              --tag "$IMAGE:$VERSION" \
              --push . && exit 0
            [ "$i" = 5 ] && break
            echo "Build attempt $i failed, retrying in $((15 * i))s"
            sleep $((15 * i))
          done
          exit 1

      # Runs against what was actually pushed, which a local build would not prove.
      - name: Smoke test pushed image
        run: docker run --rm --pull always --platform linux/amd64 "$IMAGE:$VERSION" --list-presets

      - name: Promote to :latest
        run: |
          # Resolved after the build, so the dist-tag has settled and a slow or redriven
          # run cannot hand :latest to a version npm has already moved past.
          NPM_LATEST=""
          for i in 1 2 3; do
            NPM_LATEST=$(npm view @softeria/ms-365-mcp-server version 2>/dev/null || true)
            [ -n "$NPM_LATEST" ] && break
            sleep $((5 * i))
          done

          # Failing loudly, because skipping the tag silently leaves :latest stale and the
          # Azure Container Apps example defaults to it.
          if [ -z "$NPM_LATEST" ]; then
            echo "Could not resolve the published latest version" && exit 1
          fi

          if [ "$NPM_LATEST" != "$VERSION" ]; then
            echo "npm latest is $NPM_LATEST, leaving :latest where it is"
            exit 0
          fi

          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
