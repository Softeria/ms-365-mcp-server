<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Files</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
        font-size: var(--font-text-sm-size, 14px);
        line-height: var(--font-text-sm-line-height, 1.4);
        color: var(--color-text-primary, CanvasText);
        background: var(--color-background-primary, transparent);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        padding: 12px;
      }
      button {
        font: inherit;
        color: inherit;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      nav {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        font-weight: var(--font-weight-semibold, 600);
      }
      .crumb {
        border: 0;
        background: none;
        padding: 2px 4px;
        border-radius: var(--border-radius-sm, 4px);
        cursor: pointer;
        color: var(--color-text-info, LinkText);
      }
      .crumb:disabled {
        cursor: default;
        color: inherit;
      }
      .sep {
        color: var(--color-text-tertiary, GrayText);
      }
      .tool {
        flex: none;
        border: 1px solid var(--color-border-secondary, rgba(127, 127, 127, 0.4));
        background: none;
        padding: 4px 10px;
        border-radius: var(--border-radius-sm, 4px);
        cursor: pointer;
      }
      .tool:disabled {
        opacity: 0.5;
        cursor: default;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 420px;
        overflow-y: auto;
        border-top: 1px solid var(--color-border-tertiary, rgba(127, 127, 127, 0.25));
      }
      li {
        border-bottom: 1px solid var(--color-border-tertiary, rgba(127, 127, 127, 0.25));
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 6px;
        border: 0;
        background: none;
        text-align: left;
        cursor: pointer;
      }
      .row:hover:not(:disabled),
      .row:focus-visible {
        background: var(--color-background-secondary, rgba(127, 127, 127, 0.12));
      }
      .row:disabled {
        cursor: default;
      }
      .icon {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .icon.folder path {
        fill: var(--color-text-warning, #d9a21b);
      }
      .icon.file path {
        fill: none;
        stroke: var(--color-text-secondary, GrayText);
        stroke-width: 1.3;
        stroke-linejoin: round;
      }
      .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        flex: none;
        color: var(--color-text-secondary, GrayText);
        font-size: var(--font-text-xs-size, 12px);
      }
      #more {
        margin-top: 8px;
      }
      #status {
        margin: 8px 0 0;
        color: var(--color-text-secondary, GrayText);
      }
      #status.error {
        color: var(--color-text-danger, #c62828);
      }
    </style>
  </head>
  <body>
    <header>
      <nav id="crumbs" aria-label="Folder path"></nav>
      <button id="refresh" class="tool" type="button" disabled>Refresh</button>
    </header>
    <ul id="items" hidden></ul>
    <button id="more" class="tool" type="button" hidden>Load more</button>
    <p id="status" role="status">Loading...</p>
    <script type="application/json" id="mcp-app-config">
      __MCP_APP_CONFIG__
    </script>
    <script>
      (() => {
        'use strict';

        // MCP Apps (spec 2026-01-26): JSON-RPC 2.0 with the host over postMessage
        const PROTOCOL_VERSION = '2026-01-26';
        // What the view needs from each item when it lists a folder itself
        const SELECT =
          'id,name,size,lastModifiedDateTime,webUrl,folder,file,package,parentReference,remoteItem';
        // Without these the view can't open folders or files (id always comes back)
        const NEEDED = ['name', 'folder', 'file', 'webUrl'];
        const PAGE_SIZE = 100;
        // Like the official SDK: a request the host never answers fails instead of hanging
        const REQUEST_TIMEOUT_MS = 60000;
        const FOLDER_ICON =
          'M2 5.5A1.5 1.5 0 0 1 3.5 4h4.4l1.6 2h7A1.5 1.5 0 0 1 18 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 2 14.5z';
        const FILE_ICON = 'M5 2.5h6.5L15 6v11.5H5zM11.5 2.5V6H15';

        let config = {};
        try {
          config = JSON.parse(document.getElementById('mcp-app-config').textContent) || {};
        } catch {
          // Unfilled placeholder: the view can still show the result, just not navigate
        }

        const els = {
          crumbs: document.getElementById('crumbs'),
          refresh: document.getElementById('refresh'),
          items: document.getElementById('items'),
          more: document.getElementById('more'),
          status: document.getElementById('status'),
        };

        const state = {
          hostCapabilities: {},
          locale: undefined,
          // Arguments of the tool call the host rendered this view for
          input: undefined,
          // Whether that call's result has arrived
          shown: false,
          // { driveId, id, name } of the folders opened here, outermost first
          crumbs: [],
          items: [],
          nextLink: undefined,
          // The arguments behind the current page; the next page repeats them with skiptoken
          lastArgs: undefined,
          busy: false,
        };

        let nextId = 1;
        const pending = new Map();

        function post(message) {
          window.parent.postMessage(Object.assign({ jsonrpc: '2.0' }, message), '*');
        }

        function request(method, params) {
          const id = nextId++;
          return new Promise((resolve, reject) => {
            const timer = setTimeout(
              () => settle(id, new Error('The host did not answer in time.')),
              REQUEST_TIMEOUT_MS
            );
            pending.set(id, { method, resolve, reject, timer });
            post({ id, method, params });
          });
        }

        function settle(id, error, result) {
          const waiter = pending.get(id);
          if (!waiter) return;
          pending.delete(id);
          clearTimeout(waiter.timer);
          if (error) waiter.reject(error);
          else waiter.resolve(result);
        }

        function notify(method, params) {
          post({ method, params });
        }

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent) return;
          const msg = event.data;
          if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;
          if (typeof msg.method === 'string') {
            if (msg.id !== undefined) answerHost(msg);
            else onNotification(msg.method, msg.params || {});
            return;
          }
          if (msg.error) settle(msg.id, new Error(msg.error.message || 'The host refused.'));
          else settle(msg.id, undefined, msg.result);
        });

        function answerHost(msg) {
          if (msg.method === 'ui/resource-teardown' || msg.method === 'ping') {
            post({ id: msg.id, result: {} });
          } else {
            post({ id: msg.id, error: { code: -32601, message: 'Method not found' } });
          }
        }

        // Only the first tool-input and tool-result count: they are the call that opened the
        // view. Hosts may echo the view's own calls here too (the spec's interactive phase),
        // and those answers already come back to load().
        function onNotification(method, params) {
          if (method === 'ui/notifications/tool-input') {
            if (!state.input && !state.shown) {
              state.input = isObject(params.arguments) ? params.arguments : {};
            }
          } else if (method === 'ui/notifications/tool-result') {
            if (!state.shown) {
              state.shown = true;
              showToolResult(params);
            }
          } else if (method === 'ui/notifications/tool-cancelled') {
            if (state.busy) {
              for (const [id, waiter] of pending) {
                if (waiter.method === 'tools/call') {
                  settle(id, new Error('The listing was cancelled.'));
                }
              }
            } else if (!state.shown) {
              setStatus('The listing was cancelled.', true);
            }
          } else if (method === 'ui/notifications/host-context-changed') {
            applyHostContext(params);
          }
        }

        function applyHostContext(context) {
          if (!isObject(context)) return;
          const root = document.documentElement;
          if (context.theme === 'light' || context.theme === 'dark') {
            root.dataset.theme = context.theme;
            root.style.colorScheme = context.theme;
          }
          const variables = context.styles && context.styles.variables;
          if (isObject(variables)) {
            for (const [name, value] of Object.entries(variables)) {
              if (name.startsWith('--') && typeof value === 'string') {
                root.style.setProperty(name, value);
              }
            }
          }
          if (typeof context.locale === 'string') state.locale = context.locale;
        }

        // A list-folder-style result: { value: [driveItem], @odata.nextLink? } as JSON text
        function readListing(result) {
          const blocks = result && Array.isArray(result.content) ? result.content : [];
          const text = blocks
            .filter((block) => block && block.type === 'text' && typeof block.text === 'string')
            .map((block) => block.text)
            .join('');
          const failed = Boolean(result && result.isError);
          let data;
          try {
            data = JSON.parse(text);
          } catch {
            throw new Error(
              failed
                ? text || 'The listing failed.'
                : 'This result is not JSON, so it is not shown here.'
            );
          }
          if (failed || (isObject(data) && data.error)) {
            throw new Error(errorText(data) || 'The listing failed.');
          }
          if (!isObject(data) || !Array.isArray(data.value)) {
            throw new Error('This result is not a folder listing.');
          }
          return {
            items: data.value.filter(isObject),
            nextLink: str(data['@odata.nextLink']),
          };
        }

        // { error: 'text' }, Graph's { error: { message } } or { error: 'code', message }
        function errorText(data) {
          if (!isObject(data)) return undefined;
          if (typeof data.message === 'string') return data.message;
          if (typeof data.error === 'string') return data.error;
          if (isObject(data.error) && typeof data.error.message === 'string') {
            return data.error.message;
          }
          return undefined;
        }

        function showToolResult(result) {
          let listing;
          try {
            listing = readListing(result);
          } catch (error) {
            setStatus(error.message, true);
            updateControls();
            return;
          }
          const input = state.input || {};
          const parent = (listing.items[0] && listing.items[0].parentReference) || {};
          const driveId = str(input.driveId) || str(parent.driveId);
          const id = str(input.driveItemId) || str(parent.id);
          state.crumbs = driveId && id ? [{ driveId, id, name: folderName(parent.path, id) }] : [];
          state.lastArgs = state.input ? pageArgs(state.input) : undefined;
          state.items = listing.items;
          state.nextLink = listing.nextLink;
          render();
        }

        // parentReference.path is like /drive/root:/Documents/Reports
        function folderName(path, id) {
          if (typeof path === 'string' && path.includes('root:')) {
            const parts = path
              .slice(path.indexOf('root:') + 5)
              .split('/')
              .filter(Boolean);
            return parts.length ? decode(parts[parts.length - 1]) : 'Root';
          }
          return id === 'root' ? 'Root' : 'Folder';
        }

        function listArgs(driveId, id) {
          const args = { driveId, driveItemId: id, select: SELECT, top: PAGE_SIZE };
          const account = state.input && str(state.input.account);
          if (account) args.account = account;
          return args;
        }

        async function load(args, crumbs, append) {
          if (state.busy || !canCallTools()) return;
          state.busy = true;
          setStatus('Loading...', false);
          updateControls();
          try {
            const result = await request('tools/call', { name: config.toolName, arguments: args });
            const listing = readListing(result);
            state.crumbs = crumbs;
            state.lastArgs = pageArgs(args);
            state.items = append ? state.items.concat(listing.items) : listing.items;
            state.nextLink = listing.nextLink;
            state.busy = false;
            render();
          } catch (error) {
            state.busy = false;
            setStatus(error.message || String(error), true);
            updateControls();
          }
        }

        function openFolder(folder) {
          load(listArgs(folder.driveId, folder.id), state.crumbs.concat([folder]), false);
        }

        function openCrumb(index) {
          const crumb = state.crumbs[index];
          load(listArgs(crumb.driveId, crumb.id), state.crumbs.slice(0, index + 1), false);
        }

        // Lists the folder again with the fields the view needs, keeping the listing's own
        // filter or order
        function refresh() {
          const crumb = current();
          if (!crumb) return;
          const args = pageArgs(state.lastArgs || {});
          delete args.excludeResponse;
          load(Object.assign(args, listArgs(crumb.driveId, crumb.id)), state.crumbs, false);
        }

        function loadMore() {
          const crumb = current();
          const base = state.lastArgs || (crumb && listArgs(crumb.driveId, crumb.id));
          if (!state.nextLink || !base) return;
          load(Object.assign(pageArgs(base), { skiptoken: state.nextLink }), state.crumbs, true);
        }

        async function openLink(url) {
          try {
            const result = await request('ui/open-link', { url });
            if (result && result.isError) setStatus('The host did not open the link.', true);
          } catch (error) {
            setStatus(error.message || 'The host did not open the link.', true);
          }
        }

        function render() {
          renderCrumbs();
          const folders = state.items.filter(isFolder);
          const files = state.items.filter((item) => !isFolder(item));
          const rows = folders.concat(files).map(renderRow);
          els.items.replaceChildren(...rows);
          els.items.hidden = rows.length === 0;
          setStatus(rows.length === 0 ? 'This folder is empty.' : selectHint(), false);
          updateControls();
        }

        // Models often pick their own select and leave out fields the view needs
        function selectHint() {
          const select = state.lastArgs && state.lastArgs.select;
          if (select === undefined || !canCallTools() || !current()) return '';
          const fields = (Array.isArray(select) ? select : String(select).split(',')).map((field) =>
            String(field).trim().toLowerCase()
          );
          if (NEEDED.every((field) => fields.includes(field.toLowerCase()))) return '';
          return 'This listing leaves out details the browser needs. Refresh to load them.';
        }

        function renderCrumbs() {
          const parts = [];
          state.crumbs.forEach((crumb, index) => {
            if (index > 0) parts.push(span('sep', '/'));
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'crumb';
            button.textContent = crumb.name;
            if (index === state.crumbs.length - 1) {
              button.disabled = true;
              button.setAttribute('aria-current', 'location');
            } else if (canCallTools()) {
              button.addEventListener('click', () => openCrumb(index));
            } else {
              button.disabled = true;
            }
            parts.push(button);
          });
          els.crumbs.replaceChildren(...parts);
        }

        function renderRow(item) {
          // A shortcut to a folder shared from another drive carries the real item here
          const target = isObject(item.remoteItem) ? item.remoteItem : item;
          const folder = isFolder(item);
          const name = str(item.name) || str(target.name) || '(no name)';
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'row';
          button.title = name;
          button.append(
            icon(folder),
            span('name', name),
            span('meta', describe(item, target, folder))
          );
          const action = rowAction(item, target, folder, name);
          if (action) button.addEventListener('click', action);
          else button.disabled = true;
          const li = document.createElement('li');
          li.append(button);
          return li;
        }

        function rowAction(item, target, folder, name) {
          if (folder && canCallTools()) {
            const parent = isObject(target.parentReference) ? target.parentReference : {};
            // A shortcut's folder is on another drive, so never borrow this one's id for it
            const here = target === item ? current() && current().driveId : undefined;
            const driveId = str(parent.driveId) || here;
            const id = str(target.id);
            if (driveId && id) return () => openFolder({ driveId, id, name });
          }
          const url = httpsUrl(target.webUrl) || httpsUrl(item.webUrl);
          if (url && canOpenLinks()) return () => openLink(url);
          return undefined;
        }

        function describe(item, target, folder) {
          const parts = [];
          if (folder) {
            const count = target.folder.childCount;
            if (typeof count === 'number') parts.push(count === 1 ? '1 item' : count + ' items');
          } else if (typeof target.size === 'number') {
            parts.push(formatSize(target.size));
          }
          const date = formatDate(target.lastModifiedDateTime || item.lastModifiedDateTime);
          if (date) parts.push(date);
          return parts.join(' · ');
        }

        function formatSize(bytes) {
          const units = ['B', 'KB', 'MB', 'GB', 'TB'];
          let value = bytes;
          let unit = 0;
          while (value >= 1024 && unit < units.length - 1) {
            value /= 1024;
            unit++;
          }
          return (
            (unit === 0 ? String(value) : value.toFixed(value < 10 ? 1 : 0)) + ' ' + units[unit]
          );
        }

        function formatDate(value) {
          if (typeof value !== 'string') return '';
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return '';
          try {
            return new Intl.DateTimeFormat(state.locale, { dateStyle: 'medium' }).format(date);
          } catch {
            return date.toISOString().slice(0, 10);
          }
        }

        function icon(folder) {
          const ns = 'http://www.w3.org/2000/svg';
          const svg = document.createElementNS(ns, 'svg');
          svg.setAttribute('viewBox', '0 0 20 20');
          svg.setAttribute('class', folder ? 'icon folder' : 'icon file');
          svg.setAttribute('aria-hidden', 'true');
          const path = document.createElementNS(ns, 'path');
          path.setAttribute('d', folder ? FOLDER_ICON : FILE_ICON);
          svg.append(path);
          return svg;
        }

        function span(className, text) {
          const el = document.createElement('span');
          el.className = className;
          el.textContent = text;
          return el;
        }

        function setStatus(text, isError) {
          els.status.textContent = text;
          els.status.hidden = !text;
          els.status.classList.toggle('error', Boolean(isError));
        }

        function updateControls() {
          els.refresh.disabled = state.busy || !current() || !canCallTools();
          els.more.hidden = !state.nextLink || !canCallTools();
          els.more.disabled = state.busy;
        }

        function current() {
          return state.crumbs[state.crumbs.length - 1];
        }

        function canCallTools() {
          return Boolean(state.hostCapabilities.serverTools && config.toolName);
        }

        function canOpenLinks() {
          return Boolean(state.hostCapabilities.openLinks);
        }

        function isFolder(item) {
          const target = isObject(item.remoteItem) ? item.remoteItem : item;
          return isObject(target.folder);
        }

        function isObject(value) {
          return typeof value === 'object' && value !== null && !Array.isArray(value);
        }

        function str(value) {
          return typeof value === 'string' && value ? value : undefined;
        }

        function decode(value) {
          try {
            return decodeURIComponent(value);
          } catch {
            return value;
          }
        }

        // The arguments a listing repeats for its next page: no cursor, and never every
        // page at once
        function pageArgs(args) {
          const copy = Object.assign({}, args);
          delete copy.skiptoken;
          delete copy.fetchAllPages;
          return copy;
        }

        function httpsUrl(value) {
          if (typeof value !== 'string') return undefined;
          try {
            const url = new URL(value);
            return url.protocol === 'https:' ? url.href : undefined;
          } catch {
            return undefined;
          }
        }

        // Tell the host how tall the view is, like the official App's autoResize
        let lastWidth = 0;
        let lastHeight = 0;
        let sizeQueued = false;
        function reportSize() {
          if (sizeQueued) return;
          sizeQueued = true;
          requestAnimationFrame(() => {
            sizeQueued = false;
            const root = document.documentElement;
            const previous = root.style.height;
            root.style.height = 'max-content';
            const height = Math.ceil(root.getBoundingClientRect().height);
            root.style.height = previous;
            const width = Math.ceil(window.innerWidth);
            if (width === lastWidth && height === lastHeight) return;
            lastWidth = width;
            lastHeight = height;
            notify('ui/notifications/size-changed', { width, height });
          });
        }

        els.refresh.addEventListener('click', refresh);
        els.more.addEventListener('click', loadMore);

        request('ui/initialize', {
          appInfo: { name: 'ms-365-file-browser', version: '1.0.0' },
          appCapabilities: {},
          protocolVersion: PROTOCOL_VERSION,
        }).then(
          (result) => {
            state.hostCapabilities = (result && result.hostCapabilities) || {};
            applyHostContext(result && result.hostContext);
            notify('ui/notifications/initialized', {});
            const observer = new ResizeObserver(reportSize);
            observer.observe(document.documentElement);
            observer.observe(document.body);
            if (state.items.length || state.crumbs.length) render();
          },
          (error) => setStatus('Could not connect to the host: ' + error.message, true)
        );
      })();
    </script>
  </body>
</html>
