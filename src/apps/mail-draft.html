<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mail draft</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
        font-size: var(--font-text-sm-size, 14px);
        line-height: var(--font-text-sm-line-height, 1.4);
        color: var(--color-text-primary, CanvasText);
        background: var(--color-background-primary, transparent);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        padding: 12px;
      }
      button {
        font: inherit;
        color: inherit;
        border-radius: var(--border-radius-sm, 4px);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      h1 {
        margin: 0 0 8px;
        font-size: var(--font-heading-sm-size, 16px);
        font-weight: var(--font-weight-semibold, 600);
        overflow-wrap: anywhere;
      }
      .fields {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 12px;
        margin-bottom: 8px;
      }
      .label {
        color: var(--color-text-secondary, GrayText);
      }
      .value {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      #body {
        max-height: 320px;
        overflow-y: auto;
        padding: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid var(--color-border-tertiary, rgba(127, 127, 127, 0.25));
        border-radius: var(--border-radius-sm, 4px);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .primary {
        border: 1px solid transparent;
        background: var(--color-text-primary, CanvasText);
        color: var(--color-background-primary, Canvas);
        padding: 4px 16px;
        font-weight: var(--font-weight-semibold, 600);
      }
      .tool {
        border: 1px solid var(--color-border-secondary, rgba(127, 127, 127, 0.4));
        background: none;
        padding: 4px 12px;
      }
      #status {
        margin: 8px 0 0;
        color: var(--color-text-secondary, GrayText);
      }
      #status.error {
        color: var(--color-text-danger, #c62828);
      }
    </style>
  </head>
  <body>
    <h1 id="subject">Mail draft</h1>
    <div id="fields" class="fields"></div>
    <div id="body" hidden></div>
    <div class="actions">
      <button id="send" class="primary" type="button" hidden>Send</button>
      <button id="open" class="tool" type="button" hidden>Open in Outlook</button>
    </div>
    <p id="status" role="status">Loading...</p>
    <script type="application/json" id="mcp-app-config">
      __MCP_APP_CONFIG__
    </script>
    <script>
      __MCP_APP_BRIDGE__
    </script>
    <script>
      __MCP_APP_SCRIPT__
    </script>
  </body>
</html>
